# The saved reels from the PRD's Input table.
#
# scan_page:   true  = go through the creator's whole page (Step 1).
#              false = use only this saved reel; never open the creator's page.
# extra_focus: true  = deepest breakdown of every section, most weight in the combined style.
# scope:       full    = break down everything (default).
#              format  = break down the format itself (reel 5: green-screen over a YouTube video).
#              message = break down only the message and the story (reels 11 and 12).
# likes:       what the user likes, in their words. It decides which sections go deepest:
#              editing -> E-H; page/branding/concept/community -> J;
#              education/stories/inspiration/authenticity/engagement -> B, C, D, I.
#              Set deep_sections: [...] on a reel to override the automatic choice.

reels:
